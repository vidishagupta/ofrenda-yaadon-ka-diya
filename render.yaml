services:
  - type: web
    name: ofrenda-yaadon-ka-diya
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: PORT
        value: 3000
      # Hosted open-weight endpoint for cloud deployment (e.g., Groq, OpenRouter, Together)
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: gemma2-9b-it
      - key: AI_API_KEY
        sync: false
